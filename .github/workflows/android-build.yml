name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Tests unitaires (logique du téléprompteur + découpage en phrases)
  # ---------------------------------------------------------------------------
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cartographier les dossiers de build
        run: |
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
          ls -la "$GRADLE_USER_HOME/wrapper/dists" 2>/dev/null || echo "Aucune distribution en cache"

      - name: Lancer les tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) Compilation de l'APK
  # ---------------------------------------------------------------------------
  build:
    name: Compiler l'APK ${{ github.event.inputs.build_type || 'debug' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cartographier les dossiers de build
        run: |
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
          ls -la "$GRADLE_USER_HOME/wrapper/dists" 2>/dev/null || echo "Aucune distribution en cache"

      - name: Rendre le wrapper exécutable
        run: chmod +x gradlew

      - name: Compiler (debug)
        if: ${{ (github.event.inputs.build_type || 'debug') == 'debug' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compiler (release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            cat > keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Signature release configurée."
          else
            echo "::warning::Aucun keystore fourni : l'APK release sera non signé."
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: scriptcam-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
